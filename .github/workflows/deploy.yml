name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          # Deletes the lockfile inside the CI runner to force npm to resolve the correct native binaries for Linux x64
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: 🏗️ Build production files
        run: npm run build

      - name: 🚀 Deploy via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
          # Loose security allows connection over standard FTP if FTPS is misconfigured or has invalid/self-signed SSL
          security: loose
