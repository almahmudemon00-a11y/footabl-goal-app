name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci || npm install
          npm install @tailwindcss/oxide-linux-x64-gnu --no-save --legacy-peer-deps

      - name: 🏗️ Build production files
        run: npm run build

      - name: 🚀 Deploy via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Uses FTP_DIR secret if provided, otherwise defaults to standard public_html/
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
          # Loose security allows connection over standard FTP if FTPS is misconfigured or has invalid/self-signed SSL
          security: loose
